packages:
  - apps/*
  - packages/*

# Every pnpm setting lives here and nowhere else. pnpm 10 reads this file *and*
# `package.json#pnpm`, and for a key present in both this file silently wins —
# so a second copy of `onlyBuiltDependencies` is dead configuration that reads
# as enforced. `pnpm policy` fails when one appears.

# The single lifecycle-script allowlist. A dependency not named here never runs
# its install scripts, which is the blast radius a compromised package needs.
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - prisma

# Refused on purpose, recorded so the refusal is a decision rather than an
# oversight: `@sentry/cli` downloads a platform binary from its postinstall, and
# nothing in this repository uploads source maps at build time.
ignoredBuiltDependencies:
  - "@sentry/cli"

# Minutes a version must have existed on the registry before pnpm will resolve
# it. Malicious releases are typically yanked within hours, so a day of distance
# turns most registry compromises into someone else's incident. `--frozen-lockfile`
# installs an already-resolved tree and is unaffected.
minimumReleaseAge: 1440

packageExtensions:
  "@react-native/jest-preset@*":
    dependencies:
      "@babel/runtime": ^7.29.7

# Transitive versions this repository refuses to resolve, each with the reason it
# is here. An override is a decision about someone else's dependency tree, so it
# is recorded rather than left for a reader to reverse-engineer, and it goes when
# the upstream range moves.
overrides:
  # `typed-rest-client@2.3.1` (Stryker's dashboard reporter) pins qs 6.15.1,
  # which carries a remotely triggerable DoS in `qs.stringify`. Every other
  # consumer in this tree already resolves 6.15.3; this makes that unanimous.
  qs: ^6.15.3
  # The three below answer the advisories the daily sensor filed as issue #23,
  # and each is here because a version bump could not have reached it. Dependabot
  # proposes a newer *parent*; none of these parents can resolve the fix.
  #
  # `next@15.5` depends on `postcss` at an exact `8.4.31`, so no release in that
  # line moves it, and two path-traversal advisories (<=8.5.11, <=8.5.17) read
  # arbitrary files through a `sourceMappingURL` in a CSS comment. 8.5.22 was
  # already resolved in this tree for every other consumer, so this dedupes to a
  # version the build had proven before the override existed.
  postcss: ^8.5.22
  # `minimatch@10.2.5` asks for `^5.0.5`, so 5.0.8 satisfies it and fixes an
  # unbounded-expansion OOM. The selector is load-bearing: three majors of this
  # package coexist here (`minimatch@3` wants `^1.1.7` and calls the export as a
  # function, which v5 is not), so a bare `brace-expansion:` key collapses all
  # three and ESLint dies with `TypeError: expand is not a function`. Override
  # the line that carries the advisory, never the name.
  brace-expansion@^5: ^5.0.8
  #
  # `sharp` is deliberately NOT overridden. Four inherited libvips CVEs are fixed
  # in 0.35.0, but `next@15.5` declares `sharp: ^0.34.3` — a cap, not a stale
  # lockfile — so clearing this one means running the image pipeline on a version
  # its consumer does not claim to support. An override in a template is
  # inherited by every product built from it, which is the wrong place to make
  # that bet; the fix belongs in a Next release that widens the range. Nothing
  # here reaches it (no `next/image` in the app), and it stays on the sensor's
  # report until then.
