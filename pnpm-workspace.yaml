packages:
  - apps/*
  - packages/*

# Every pnpm setting lives here and nowhere else. pnpm 10 reads this file *and*
# `package.json#pnpm`, and for a key present in both this file silently wins —
# so a second copy of `onlyBuiltDependencies` is dead configuration that reads
# as enforced. `pnpm policy` fails when one appears.

# The single lifecycle-script allowlist. A dependency not named here never runs
# its install scripts, which is the blast radius a compromised package needs.
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - prisma

# Refused on purpose, recorded so the refusal is a decision rather than an
# oversight: `@sentry/cli` downloads a platform binary from its postinstall, and
# nothing in this repository uploads source maps at build time.
ignoredBuiltDependencies:
  - "@sentry/cli"

# Minutes a version must have existed on the registry before pnpm will resolve
# it. Malicious releases are typically yanked within hours, so a day of distance
# turns most registry compromises into someone else's incident. `--frozen-lockfile`
# installs an already-resolved tree and is unaffected.
minimumReleaseAge: 1440

packageExtensions:
  "@react-native/jest-preset@*":
    dependencies:
      "@babel/runtime": ^7.29.7

# Transitive versions this repository refuses to resolve, each with the reason it
# is here. An override is a decision about someone else's dependency tree, so it
# is recorded rather than left for a reader to reverse-engineer, and it goes when
# the upstream range moves.
overrides:
  # One React for the whole workspace. `apps/mobile` pins `react` and
  # `react-dom` exactly (React Native's renderer is built against one React
  # release), and packages that only *peer* on React — `better-auth`, `prisma`,
  # `use-intl` — would otherwise auto-install the registry's newest, which
  # leaves a `react-dom` of one version paired with a `react` of another. Move
  # these together with `apps/mobile`, never apart.
  react: 19.2.8
  react-dom: 19.2.8
  # The three below answer advisories the weekly sensor reports (issue #23). Each
  # fixed version satisfies the range its parent already declares, so nothing
  # but the lockfile stood in the way. The selector names the *line* that
  # carries the advisory, never the package: three majors of `brace-expansion`
  # and two of `js-yaml` coexist here, and a bare key collapses them — ESLint
  # then dies with `TypeError: expand is not a function`, because
  # `minimatch@3` calls the export as a function and v5 is not one.
  #
  # eslint > minimatch@3.1.5 declares `^1.1.7`. GHSA-mh99-v99m-4gvg,
  # GHSA-rgw5-rvv9-x895, GHSA-6j4f-fj2g-mc7p, GHSA-qhr7-859c-m2p7.
  brace-expansion@^1: ^1.1.20
  # jest > @jest/core > @jest/transform > babel-plugin-istanbul >
  # @istanbuljs/load-nyc-config@1.1.0 declares `^3.13.1`. GHSA-2883-xcg3-v3hh.
  js-yaml@^3: ^3.15.2
  # better-auth only *peers* on mysql2 (`^3.0.0`; nothing here uses MySQL), so
  # pnpm auto-installs it and kept the stale 3.15.3. GHSA-3f6p-5ww8-9rcr.
  mysql2: ^3.22.0

# Advisories that no release, override or bump can clear, each answered by an
# entry in `packages/tooling/src/upstream-blocks.ts` so the day upstream moves,
# `pnpm deps:upstream` says so and the entry goes from both places in one
# change. Every one sits in a development-time tool and none ships in a
# deployed artefact. `pnpm audit --audit-level high` still reports anything
# not listed here, so this is a record of three decisions rather than a
# threshold: raising `--audit-level` is not a way to clear an advisory.
auditConfig:
  ignoreGhsas:
    # `braces@3.0.3` is the newest release and the advisory has no patched
    # version. Reached only through `@types/jest > expect > jest-message-util >
    # micromatch`, which the mobile test run and editor types use.
    - GHSA-vfj7-8cjw-p6xm
    # `node-forge@1.4.0` is the newest release and the advisory has no patched
    # version. Reached only through `expo > @expo/cli`, the development server.
    - GHSA-86w9-cpqp-85rv
    # `@prisma/config@7.10.0` declares `deepmerge-ts` at exactly 7.1.5; the fix
    # is 8.0.0. An override would run the Prisma CLI's config loader on a major
    # it never claimed to support, so this waits for Prisma to move.
    - GHSA-ggr8-5vv4-36mx
