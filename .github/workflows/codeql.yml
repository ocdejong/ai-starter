name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

# Nothing is granted by default; each job states the scopes it needs.
permissions: {}

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      # Required for codeql-action to read workflow-run metadata in a private repository.
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the checkout leaves no token in .git/config
          # for a later step — or an uploaded artifact — to carry away.
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: /language:javascript-typescript

  # CodeQL also runs on every push and pull request, where a failure is already
  # in front of somebody. Only the weekly run needs a destination of its own —
  # nobody is waiting on it, and its finding is the kind that stays true.
  report:
    name: Report a scheduled failure
    if: ${{ failure() && github.event_name == 'schedule' }}
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      issues: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: File or update the issue
        uses: ./.github/actions/report-failure
        with:
          label: sensor:code-scanning
          title: Weekly CodeQL analysis is failing
          summary: >-
            The scheduled CodeQL run did not complete. Either the analysis itself
            broke, or it found something `security-extended` considers a problem.
          token: ${{ github.token }}
