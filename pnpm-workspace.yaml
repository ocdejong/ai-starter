packages:
  - apps/*
  - packages/*

# Every pnpm setting lives here and nowhere else. pnpm 10 reads this file *and*
# `package.json#pnpm`, and for a key present in both this file silently wins —
# so a second copy of `onlyBuiltDependencies` is dead configuration that reads
# as enforced. `pnpm policy` fails when one appears.

# The single lifecycle-script allowlist. A dependency not named here never runs
# its install scripts, which is the blast radius a compromised package needs.
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - prisma

# Refused on purpose, recorded so the refusal is a decision rather than an
# oversight: `@sentry/cli` downloads a platform binary from its postinstall, and
# nothing in this repository uploads source maps at build time.
ignoredBuiltDependencies:
  - "@sentry/cli"

# Minutes a version must have existed on the registry before pnpm will resolve
# it. Malicious releases are typically yanked within hours, so a day of distance
# turns most registry compromises into someone else's incident. `--frozen-lockfile`
# installs an already-resolved tree and is unaffected.
minimumReleaseAge: 1440

packageExtensions:
  "@react-native/jest-preset@*":
    dependencies:
      "@babel/runtime": ^7.29.7

# Transitive versions this repository refuses to resolve, each with the reason it
# is here. An override is a decision about someone else's dependency tree, so it
# is recorded rather than left for a reader to reverse-engineer, and it goes when
# the upstream range moves.
overrides:
  # `typed-rest-client@2.3.1` (Stryker's dashboard reporter) pins qs 6.15.1,
  # which carries a remotely triggerable DoS in `qs.stringify`. Every other
  # consumer in this tree already resolves 6.15.3; this makes that unanimous.
  qs: ^6.15.3
