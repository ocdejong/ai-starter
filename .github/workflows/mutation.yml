name: Mutation

# Deliberately not a pull-request check and deliberately not in
# `.github/rulesets/main.json`. A full run rewrites and re-tests every statement
# in the two packages that carry the product's rules — minutes of work for a
# signal that moves slowly — so it runs weekly and on request instead of on every
# edit. Coverage says a line ran; this says the tests would have noticed had it
# been wrong, which is the only one of the two a suite can fake.
on:
  schedule:
    # 05:00 UTC every Monday: a report waiting on Monday morning rather than one
    # competing with the day's pull requests.
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  mutate:
    name: Mutation
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Each package's `stryker.config.json` carries its own break threshold, set
      # to the score it already earns. A drop fails the run.
      - name: Run mutation testing
        run: pnpm mutation

      - name: Upload mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore
          retention-days: 30

  # A weekly job whose red appears only in the Actions tab is the same shape as
  # the flow nobody ran. A mutation score that has silently dropped is exactly
  # the finding that would sit there unread the longest, because nothing else in
  # the suite goes red when it does.
  report:
    name: Report a scheduled failure
    if: ${{ failure() }}
    needs: mutate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      issues: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: File or update the issue
        uses: ./.github/actions/report-failure
        with:
          label: sensor:mutation
          title: Mutation testing is below its threshold
          summary: >-
            The weekly mutation run failed. Either a package scored below the
            break threshold in its `stryker.config.json` — assertions that no
            longer notice a change they used to — or the run itself broke.
          token: ${{ github.token }}
