name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing is granted by default; each job states the scopes it needs.
permissions: {}

env:
  BETTER_AUTH_SECRET: ci-only-secret-at-least-thirty-two-characters-long
  # Better Auth trusts only its own origin; Playwright's browser visits the app
  # at http://localhost:3000, so this host must match or every auth POST is
  # rejected with "Invalid origin".
  BETTER_AUTH_URL: http://localhost:3000
  CI: true
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/starter_ci
  EXPO_PUBLIC_API_URL: http://127.0.0.1:3000

jobs:
  lanes:
    name: Verify ${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lane: [checks, units, integration, native]

    # Integration tests provision their own isolated PostgreSQL containers.
    # None of these lanes needs the browser job's service database or Chromium.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Metro transforms
        if: ${{ matrix.lane == 'native' }}
        id: metro-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/metro-cache
          key: ${{ runner.os }}-${{ runner.arch }}-node24-metro-v1-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'turbo.json', '.github/workflows/ci.yml', 'packages/*/package.json', 'packages/config/typescript/*.json', 'apps/mobile/package.json', 'apps/mobile/metro.config.cjs', 'apps/mobile/babel.config.cjs', 'apps/mobile/app.json', 'apps/mobile/tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node24-metro-v1-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'turbo.json', '.github/workflows/ci.yml', 'packages/*/package.json', 'packages/config/typescript/*.json', 'apps/mobile/package.json', 'apps/mobile/metro.config.cjs', 'apps/mobile/babel.config.cjs', 'apps/mobile/app.json', 'apps/mobile/tsconfig.json') }}-

      # Lane ownership and prerequisites come from verification.ts, just as the
      # full local suite does. No check verdict or complete build is restored.
      - name: Verify lane
        env:
          VERIFY_LANE: ${{ matrix.lane }}
          TMPDIR: ${{ runner.temp }}
        run: pnpm verify --lane "$VERIFY_LANE"

      - name: Save Metro transforms
        if: ${{ success() && matrix.lane == 'native' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.metro-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/metro-cache
          key: ${{ steps.metro-cache.outputs.cache-primary-key }}

  web:
    name: Verify web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: starter_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d starter_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Compiler intermediates only: exclude fetch responses, complete .next
      # builds, .turbo verdicts and deploy artifacts. The key binds dependency,
      # compiler configuration and CI's public fixture environment; Webpack
      # invalidates changed source modules. Only trusted main pushes save.
      - name: Restore Next compiler cache
        id: next-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: apps/web/.next/cache/webpack
          key: ${{ runner.os }}-${{ runner.arch }}-node24-next-webpack-v1-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'turbo.json', '.github/workflows/ci.yml', 'packages/*/package.json', 'packages/config/typescript/*.json', 'apps/web/package.json', 'apps/web/next.config.js', 'apps/web/postcss.config.js', 'apps/web/tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node24-next-webpack-v1-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'turbo.json', '.github/workflows/ci.yml', 'packages/*/package.json', 'packages/config/typescript/*.json', 'apps/web/package.json', 'apps/web/next.config.js', 'apps/web/postcss.config.js', 'apps/web/tsconfig.json') }}-

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # This lane builds web, migrates its database, then runs the browser suite.
      - name: Verify lane
        run: pnpm verify --lane web

      - name: Save Next compiler cache
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.next-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: apps/web/.next/cache/webpack
          key: ${{ steps.next-cache.outputs.cache-primary-key }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  verify:
    name: Verify
    needs: [lanes, web]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require every lane to succeed
        env:
          LANES_RESULT: ${{ needs.lanes.result }}
          WEB_RESULT: ${{ needs.web.result }}
        run: |
          echo "checks/units/integration/native: $LANES_RESULT; web: $WEB_RESULT"
          test "$LANES_RESULT" = success && test "$WEB_RESULT" = success
