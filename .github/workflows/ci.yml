name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BETTER_AUTH_SECRET: ci-only-secret-at-least-thirty-two-characters-long
  # Better Auth trusts only its own origin; Playwright's browser visits the app
  # at http://localhost:3000, so this host must match or every auth POST is
  # rejected with "Invalid origin".
  BETTER_AUTH_URL: http://localhost:3000
  CI: true
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/starter_ci
  EXPO_PUBLIC_API_URL: http://127.0.0.1:3000

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: starter_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d starter_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # `pnpm verify` is the authoritative suite. Keeping CI on the same command
      # is what stops the required checks from drifting away from the ones an
      # agent runs locally.
      - name: Verify
        run: pnpm verify

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
