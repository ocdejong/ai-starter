name: CodeQL

# Code scanning needs a public repository or paid GitHub Advanced Security. On a
# private repository without it the analysis fails on every run and nothing can
# pass it, so the analysis job runs only where the repository is public. It runs
# on ready pull requests, never drafts, and weekly; a merge to `main` is not
# analysed again, because the pull request already analysed that tree and the
# weekly run covers queries CodeQL learns later.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

# Nothing is granted by default; each job states the scopes it needs.
permissions: {}

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    if: ${{ github.event.repository.visibility == 'public' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      # Required for codeql-action to read workflow-run metadata in a private repository.
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the checkout leaves no token in .git/config
          # for a later step — or an uploaded artifact — to carry away.
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:javascript-typescript

  # CodeQL also runs on every ready pull request, where a failure is already in
  # front of somebody. Only the weekly run needs a destination of its own —
  # nobody is waiting on it, and its finding is the kind that stays true.
  report:
    name: Report a scheduled failure
    if: ${{ failure() && github.event_name == 'schedule' }}
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # `contents: read` is load-bearing: the job checks out the local action it
    # reports through, and a private repository answers a token without it
    # "Repository not found" — every step is then skipped and the failure goes
    # unreported.
    permissions:
      contents: read
      issues: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: File or update the issue
        uses: ./.github/actions/report-failure
        with:
          label: sensor:code-scanning
          title: Weekly CodeQL analysis is failing
          summary: >-
            The scheduled CodeQL run did not complete. Either the analysis itself
            broke, or it found something `security-extended` considers a problem.
          token: ${{ github.token }}
